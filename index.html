<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JEKUNRL // Zaki — Interactive Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #06070a;
      --panel-bg: rgba(13, 16, 23, 0.78);
      --panel-border: rgba(255, 255, 255, 0.1);
      --text-main: #f3f4f6;
      --text-dim: #9ca3af;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --accent-glow: rgba(56, 189, 248, 0.4);
      --font-ui: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-serif: 'Instrument Serif', serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-ui);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Background Grid & Ambient Glow */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black 45%, transparent 95%);
      transition: opacity 0.3s ease;
    }

    .bg-grid.hidden {
      opacity: 0;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 25%, var(--accent-soft), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.08), transparent 45%);
      transition: background 0.4s ease;
    }

    /* Top HUD Bar */
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 28px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-dim);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
    }

    .hud-status {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .sound-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sound-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Main Stage */
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
    }

    /* Title & Main Menu Layout */
    .main-menu-view {
      width: 100%;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 48px;
      align-items: center;
      animation: fadeIn 0.4s ease;
    }

    .game-title-block .edition {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--accent);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: block;
    }

    .game-title-block h1 {
      font-size: clamp(3rem, 7vw, 5.2rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.04em;
      margin-bottom: 16px;
    }

    .game-title-block h1 span {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }
